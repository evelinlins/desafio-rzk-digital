<script>
  /**
   * Mercadinho Pro - Script.html
   * Lógica Reativa Client-Side, Estado Global da SPA, Atalhos e Comunicação com Apps Script.
   */

  // Estado Global da Aplicação
  const State = {
    products: [],
    config: {
      NOME_MERCADINHO: 'Mercadinho Pro',
      CNPJ_CPF: '12.345.678/0001-90',
      ENDERECO: 'Rua do Comércio, 100 - Bairro Centro',
      TELEFONE: '(11) 99999-8888',
      CHAVE_PIX: '12345678000190',
      MENSAGEM_RODAPE: 'Obrigado pela preferência! Volte sempre!'
    },
    cart: [],
    discount: 0,
    selectedPaymentMethod: 'DINHEIRO',
    lastSale: null,
    charts: {},
    currentTab: 'pdv'
  };

  // Sons Sintetizados via Web Audio API (sem dependências externas)
  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) this.ctx = new AudioContext();
      }
    },
    beepScan() {
      try {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      } catch (e) {}
    },
    chimeSuccess() {
      try {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.07);
          gain.gain.setValueAtTime(0.06, now + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.3);
        });
      } catch (e) {}
    }
  };

  // Inicialização ao Carregar o DOM
  document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    initClock();
    setupKeyboardShortcuts();
    loadInitialData();
  });

  // Relógio do Cabeçalho
  function initClock() {
    const updateTime = () => {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const el = document.getElementById('pdv-current-time');
      if (el) el.innerText = timeStr;
    };
    updateTime();
    setInterval(updateTime, 30000);
  }

  // Atalhos Globais de Teclado
  function setupKeyboardShortcuts() {
    window.addEventListener('keydown', (e) => {
      // F1: Volta ao PDV
      if (e.key === 'F1') {
        e.preventDefault();
        switchTab('pdv');
      }
      // F2: Foca no campo de busca do PDV
      if (e.key === 'F2') {
        e.preventDefault();
        switchTab('pdv');
        const input = document.getElementById('pdv-search-input');
        if (input) {
          input.focus();
          input.select();
        }
      }
      // F4: Abre fechamento de venda
      if (e.key === 'F4') {
        e.preventDefault();
        if (State.currentTab === 'pdv' && State.cart.length > 0) {
          openPaymentModal();
        }
      }
      // Esc: Fecha modais abertos
      if (e.key === 'Escape') {
        closePaymentModal();
        closeProductModal();
        closeCustomItemModal();
        closeReceiptModal();
      }
    });

    // Enter no campo de busca do PDV para leitura de código de barras
    const searchInput = document.getElementById('pdv-search-input');
    if (searchInput) {
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSearchEnter(searchInput.value.trim());
        }
      });
      searchInput.addEventListener('input', (e) => {
        handleSearchInput(e.target.value.trim());
      });
    }
  }

  // Alternância de Abas da SPA
  function switchTab(tabId) {
    State.currentTab = tabId;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
      btn.classList.add('text-slate-400');
    });

    const activeSection = document.getElementById(`tab-${tabId}`);
    const activeBtn = document.getElementById(`nav-btn-${tabId}`);

    if (activeSection) {
      activeSection.classList.remove('hidden');
      if (tabId === 'pdv') activeSection.style.display = 'grid';
      else activeSection.style.display = 'flex';
    }

    if (activeBtn) {
      activeBtn.classList.remove('text-slate-400');
      activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
    }

    if (tabId === 'pdv') {
      setTimeout(() => {
        const input = document.getElementById('pdv-search-input');
        if (input) input.focus();
      }, 100);
    } else if (tabId === 'estoque') {
      renderInventoryTable();
    } else if (tabId === 'dashboard') {
      loadDashboardMetrics();
    } else if (tabId === 'historico') {
      loadSalesHistory();
    }

    lucide.createIcons();
  }

  // Carregamento Inicial via Google Apps Script (ou Mock local)
  function loadInitialData() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(response => {
          if (response.success && response.data) {
            State.products = response.data.products || [];
            if (response.data.config) State.config = Object.assign(State.config, response.data.config);
            applyConfigToUI();
            if (response.data.userEmail) {
              document.getElementById('header-user-email').innerText = response.data.userEmail;
            }
            showToast('Dados sincronizados com sucesso!', 'success');
          } else {
            showToast(response.error || 'Erro ao carregar dados', 'error');
          }
        })
        .withFailureHandler(err => {
          showToast('Falha na conexão: ' + err.message, 'error');
        })
        .apiGetInitialData();
    } else {
      // Mock para execução de teste direto no navegador
      console.log('Ambiente local detectado. Carregando dados de demonstração.');
      State.products = [
        { id: 'PRD-001', codigoBarras: '7891000100101', nome: 'Arroz Branco Tipo 1 5kg', categoria: 'Mercearia', precoCusto: 19.50, precoVenda: 27.90, estoqueAtual: 45, estoqueMinimo: 10, unidade: 'UN', ativo: true },
        { id: 'PRD-002', codigoBarras: '7891000100102', nome: 'Feijão Carioca 1kg', categoria: 'Mercearia', precoCusto: 5.20, precoVenda: 7.89, estoqueAtual: 60, estoqueMinimo: 15, unidade: 'UN', ativo: true },
        { id: 'PRD-003', codigoBarras: '7891000100103', nome: 'Óleo de Soja 900ml', categoria: 'Mercearia', precoCusto: 4.10, precoVenda: 6.49, estoqueAtual: 4, estoqueMinimo: 8, unidade: 'UN', ativo: true },
        { id: 'PRD-004', codigoBarras: '7891000100104', nome: 'Leite Integral UHT 1L', categoria: 'Laticínios', precoCusto: 3.80, precoVenda: 5.29, estoqueAtual: 80, estoqueMinimo: 20, unidade: 'UN', ativo: true },
        { id: 'PRD-005', codigoBarras: '7891000100105', nome: 'Café Torrado e Moído 500g', categoria: 'Mercearia', precoCusto: 12.00, precoVenda: 17.50, estoqueAtual: 2, estoqueMinimo: 5, unidade: 'UN', ativo: true }
      ];
      applyConfigToUI();
    }
  }

  function applyConfigToUI() {
    document.getElementById('header-store-name').innerText = State.config.NOME_MERCADINHO || 'Mercadinho Pro';
    document.getElementById('cfg-nome').value = State.config.NOME_MERCADINHO || '';
    document.getElementById('cfg-cnpj').value = State.config.CNPJ_CPF || '';
    document.getElementById('cfg-endereco').value = State.config.ENDERECO || '';
    document.getElementById('cfg-telefone').value = State.config.TELEFONE || '';
    document.getElementById('cfg-pix').value = State.config.CHAVE_PIX || '';
    document.getElementById('cfg-rodape').value = State.config.MENSAGEM_RODAPE || '';
    document.getElementById('pay-pix-key-display').innerText = State.config.CHAVE_PIX || 'Não cadastrada';
  }

  // =========================================================================
  // LÓGICA DO PDV (PONTO DE VENDA ÁGIL)
  // =========================================================================

  let searchDebounce = null;
  function handleSearchInput(query) {
    clearTimeout(searchDebounce);
    const resultsContainer = document.getElementById('pdv-search-results');
    if (!query || query.length < 2) {
      resultsContainer.classList.add('hidden');
      return;
    }

    searchDebounce = setTimeout(() => {
      const matches = State.products.filter(p => 
        (p.ativo !== false) &&
        (p.nome.toLowerCase().includes(query.toLowerCase()) || 
         (p.codigoBarras && p.codigoBarras.includes(query)) ||
         p.categoria.toLowerCase().includes(query.toLowerCase()))
      ).slice(0, 6);

      if (matches.length === 0) {
        resultsContainer.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">Nenhum produto encontrado. Pressione Enter para adicionar avulso.</div>`;
      } else {
        resultsContainer.innerHTML = matches.map(p => `
          <div onclick="selectProductFromSearch('${p.id}')" class="p-3 hover:bg-slate-800 cursor-pointer flex items-center justify-between transition">
            <div>
              <div class="font-bold text-xs text-white">${p.nome}</div>
              <div class="text-[10px] text-slate-400">${p.categoria} • Cód: ${p.codigoBarras || p.id} • Est: ${p.estoqueAtual} ${p.unidade}</div>
            </div>
            <div class="font-mono font-bold text-sm text-emerald-400">R$ ${parseFloat(p.precoVenda).toFixed(2).replace('.', ',')}</div>
          </div>
        `).join('');
      }
      resultsContainer.classList.remove('hidden');
    }, 150);
  }

  function handleSearchEnter(query) {
    const resultsContainer = document.getElementById('pdv-search-results');
    resultsContainer.classList.add('hidden');

    if (!query) return;

    // 1. Busca por código de barras exato ou ID
    const exactMatch = State.products.find(p => 
      (p.codigoBarras && p.codigoBarras.toLowerCase() === query.toLowerCase()) ||
      (p.id.toLowerCase() === query.toLowerCase())
    );

    if (exactMatch) {
      addProductToCart(exactMatch);
      resetSearchInput();
      return;
    }

    // 2. Busca pelo primeiro item que contém o texto
    const partialMatch = State.products.find(p => p.nome.toLowerCase().includes(query.toLowerCase()));
    if (partialMatch) {
      addProductToCart(partialMatch);
      resetSearchInput();
      return;
    }

    // Se não encontrou, sugere item avulso
    document.getElementById('custom-item-name').value = query;
    openCustomItemModal();
    resetSearchInput();
  }

  function selectProductFromSearch(id) {
    const product = State.products.find(p => p.id === id);
    if (product) {
      addProductToCart(product);
    }
    document.getElementById('pdv-search-results').classList.add('hidden');
    resetSearchInput();
  }

  function resetSearchInput() {
    const input = document.getElementById('pdv-search-input');
    if (input) {
      input.value = '';
      input.focus();
    }
  }

  function addProductToCart(product, quantity = 1) {
    const existingIndex = State.cart.findIndex(item => item.idProduto === product.id);

    if (existingIndex > -1) {
      State.cart[existingIndex].quantidade += quantity;
      State.cart[existingIndex].totalItem = State.cart[existingIndex].quantidade * State.cart[existingIndex].precoUnitario;
    } else {
      State.cart.push({
        idProduto: product.id,
        nomeProduto: product.nome,
        quantidade: quantity,
        precoUnitario: parseFloat(product.precoVenda) || 0,
        totalItem: (parseFloat(product.precoVenda) || 0) * quantity
      });
    }

    AudioEngine.beepScan();
    renderCart();
  }

  function renderCart() {
    const emptyState = document.getElementById('cart-empty-state');
    const table = document.getElementById('cart-table');
    const tbody = document.getElementById('cart-tbody');
    const countBadge = document.getElementById('cart-items-count');

    if (State.cart.length === 0) {
      emptyState.classList.remove('hidden');
      table.classList.add('hidden');
      countBadge.innerText = '0 itens';
      document.getElementById('btn-checkout').disabled = true;
    } else {
      emptyState.classList.add('hidden');
      table.classList.remove('hidden');
      countBadge.innerText = `${State.cart.length} ${State.cart.length === 1 ? 'item' : 'itens'}`;
      document.getElementById('btn-checkout').disabled = false;

      tbody.innerHTML = State.cart.map((item, idx) => `
        <tr class="hover:bg-slate-900/60 transition group">
          <td class="py-2.5 px-3 text-slate-500 font-mono">${idx + 1}</td>
          <td class="py-2.5 px-3 text-white font-semibold">${item.nomeProduto}</td>
          <td class="py-2.5 px-3 text-center">
            <div class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700/80 rounded-lg p-1">
              <button onclick="updateCartItemQty(${idx}, -1)" class="w-5 h-5 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 font-bold transition">-</button>
              <input type="number" step="0.1" value="${item.quantidade}" onchange="setCartItemQty(${idx}, this.value)" class="w-12 text-center bg-transparent text-white font-mono text-xs font-semibold focus:outline-none">
              <button onclick="updateCartItemQty(${idx}, 1)" class="w-5 h-5 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 font-bold transition">+</button>
            </div>
          </td>
          <td class="py-2.5 px-3 text-right font-mono text-slate-300">R$ ${item.precoUnitario.toFixed(2).replace('.', ',')}</td>
          <td class="py-2.5 px-3 text-right font-mono font-bold text-emerald-400">R$ ${item.totalItem.toFixed(2).replace('.', ',')}</td>
          <td class="py-2.5 px-3 text-center">
            <button onclick="removeCartItem(${idx})" class="text-slate-500 hover:text-rose-400 transition p-1 rounded">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    updateCartTotals();
    lucide.createIcons();
  }

  function updateCartItemQty(index, delta) {
    if (!State.cart[index]) return;
    const newQty = State.cart[index].quantidade + delta;
    if (newQty <= 0) {
      removeCartItem(index);
    } else {
      State.cart[index].quantidade = newQty;
      State.cart[index].totalItem = newQty * State.cart[index].precoUnitario;
      renderCart();
    }
  }

  function setCartItemQty(index, val) {
    const qty = parseFloat(val) || 1;
    if (qty <= 0) {
      removeCartItem(index);
    } else {
      State.cart[index].quantidade = qty;
      State.cart[index].totalItem = qty * State.cart[index].precoUnitario;
      renderCart();
    }
  }

  function removeCartItem(index) {
    State.cart.splice(index, 1);
    renderCart();
  }

  function clearCart() {
    if (State.cart.length === 0) return;
    if (confirm('Deseja realmente limpar todos os itens da venda atual?')) {
      State.cart = [];
      State.discount = 0;
      renderCart();
      showToast('Carrinho limpo com sucesso.', 'info');
    }
  }

  function updateCartTotals() {
    const subtotal = State.cart.reduce((acc, it) => acc + it.totalItem, 0);
    const discountInput = document.getElementById('pdv-discount-input');
    const discount = parseFloat(discountInput ? discountInput.value : 0) || 0;
    State.discount = discount;
    const total = Math.max(0, subtotal - discount);

    document.getElementById('pdv-subtotal-display').innerText = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
    document.getElementById('pdv-discount-display').innerText = `- R$ ${discount.toFixed(2).replace('.', ',')}`;
    document.getElementById('pdv-total-display').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    document.getElementById('pay-modal-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
  }

  function toggleDiscountInput() {
    const container = document.getElementById('pdv-discount-container');
    container.classList.toggle('hidden');
    if (!container.classList.contains('hidden')) {
      const input = document.getElementById('pdv-discount-input');
      input.focus();
      input.select();
    }
  }

  // =========================================================================
  // FECHAMENTO DE VENDA & PAGAMENTO
  // =========================================================================

  function openPaymentModal() {
    if (State.cart.length === 0) {
      showToast('Adicione ao menos um item para finalizar.', 'warning');
      return;
    }
    updateCartTotals();
    selectPaymentMethod('DINHEIRO');
    document.getElementById('modal-payment').classList.remove('hidden');

    const total = State.cart.reduce((acc, it) => acc + it.totalItem, 0) - State.discount;
    const cashInput = document.getElementById('pay-cash-received');
    cashInput.value = total.toFixed(2);
    calculateChange();
    setTimeout(() => {
      cashInput.focus();
      cashInput.select();
    }, 100);
  }

  function closePaymentModal() {
    document.getElementById('modal-payment').classList.add('hidden');
    resetSearchInput();
  }

  function selectPaymentMethod(method) {
    State.selectedPaymentMethod = method;
    document.querySelectorAll('.pay-method-btn').forEach(b => {
      b.classList.remove('active', 'border-indigo-500', 'bg-indigo-500/20', 'text-indigo-300', 'font-bold');
      b.classList.add('border-slate-700', 'bg-slate-900', 'text-slate-300');
    });

    const activeBtn = document.getElementById(`pay-opt-${method}`);
    if (activeBtn) {
      activeBtn.classList.remove('border-slate-700', 'bg-slate-900', 'text-slate-300');
      activeBtn.classList.add('active', 'border-indigo-500', 'bg-indigo-500/20', 'text-indigo-300', 'font-bold');
    }

    const cashSec = document.getElementById('pay-cash-section');
    const pixSec = document.getElementById('pay-pix-section');

    if (method === 'DINHEIRO') {
      cashSec.classList.remove('hidden');
      pixSec.classList.add('hidden');
    } else if (method === 'PIX') {
      cashSec.classList.add('hidden');
      pixSec.classList.remove('hidden');
    } else {
      cashSec.classList.add('hidden');
      pixSec.classList.add('hidden');
    }
  }

  function calculateChange() {
    const subtotal = State.cart.reduce((acc, it) => acc + it.totalItem, 0);
    const total = Math.max(0, subtotal - State.discount);
    const received = parseFloat(document.getElementById('pay-cash-received').value) || 0;
    const change = Math.max(0, received - total);
    document.getElementById('pay-change-display').innerText = `R$ ${change.toFixed(2).replace('.', ',')}`;
  }

  function confirmSaleCheckout() {
    const btn = document.getElementById('btn-confirm-checkout');
    btn.disabled = true;
    btn.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> Processando Venda...`;

    const subtotal = State.cart.reduce((acc, it) => acc + it.totalItem, 0);
    const total = Math.max(0, subtotal - State.discount);
    const received = State.selectedPaymentMethod === 'DINHEIRO' ? (parseFloat(document.getElementById('pay-cash-received').value) || total) : total;
    const troco = Math.max(0, received - total);

    const salePayload = {
      subtotal: subtotal,
      desconto: State.discount,
      total: total,
      formaPagamento: State.selectedPaymentMethod,
      valorRecebido: received,
      troco: troco,
      itens: State.cart
    };

    const handleSuccess = (saleData) => {
      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>CONFIRMAR & EMITIR CUPOM</span>`;
      closePaymentModal();
      
      // Efeitos de Sucesso
      AudioEngine.chimeSuccess();
      confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });

      // Atualiza estoque localmente
      State.cart.forEach(item => {
        const prod = State.products.find(p => p.id === item.idProduto);
        if (prod) {
          prod.estoqueAtual = Math.max(0, (parseFloat(prod.estoqueAtual) || 0) - item.quantidade);
        }
      });

      // Limpa carrinho e abre cupom
      State.cart = [];
      State.discount = 0;
      document.getElementById('pdv-discount-input').value = '0.00';
      renderCart();

      // Abre Cupom Térmico
      openReceiptModal(saleData);
      showToast('Venda registrada com sucesso!', 'success');
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(response => {
          if (response.success && response.data) {
            handleSuccess(response.data);
          } else {
            btn.disabled = false;
            btn.innerHTML = `<span>Tentar Novamente</span>`;
            showToast(response.error || 'Erro ao processar venda', 'error');
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerHTML = `<span>Tentar Novamente</span>`;
          showToast('Erro no servidor: ' + err.message, 'error');
        })
        .apiProcessSale(salePayload);
    } else {
      // Mock local
      const mockSale = Object.assign({}, salePayload, {
        idVenda: 'VND-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(1000 + Math.random()*9000),
        dataHora: new Date().toISOString(),
        operador: 'operador.local@mercadinho.com'
      });
      setTimeout(() => handleSuccess(mockSale), 400);
    }
  }

  // =========================================================================
  // EMISSÃO E IMPRESSÃO DO CUPOM TÉRMICO
  // =========================================================================

  function openReceiptModal(sale) {
    State.lastSale = sale;

    document.getElementById('receipt-store-name').innerText = State.config.NOME_MERCADINHO || 'MERCADINHO PRO';
    document.getElementById('receipt-store-cnpj').innerText = `CNPJ/CPF: ${State.config.CNPJ_CPF || '00.000.000/0001-00'}`;
    document.getElementById('receipt-store-address').innerText = State.config.ENDERECO || '';
    document.getElementById('receipt-store-phone').innerText = `Tel: ${State.config.TELEFONE || ''}`;
    
    document.getElementById('receipt-id').innerText = sale.idVenda;
    const dt = new Date(sale.dataHora);
    document.getElementById('receipt-datetime').innerText = dt.toLocaleString('pt-BR');
    document.getElementById('receipt-operator').innerText = sale.operador || 'Caixa 01';

    const itemsContainer = document.getElementById('receipt-items-list');
    itemsContainer.innerHTML = sale.itens.map(it => `
      <div class="py-1 flex justify-between">
        <span class="w-8 text-gray-700">${it.quantidade}</span>
        <span class="flex-1 px-1 font-semibold truncate">${it.nomeProduto}</span>
        <span class="w-14 text-right text-gray-600">${parseFloat(it.precoUnitario).toFixed(2).replace('.', ',')}</span>
        <span class="w-14 text-right font-bold">${parseFloat(it.totalItem).toFixed(2).replace('.', ',')}</span>
      </div>
    `).join('');

    document.getElementById('receipt-subtotal').innerText = `R$ ${parseFloat(sale.subtotal).toFixed(2).replace('.', ',')}`;
    const discRow = document.getElementById('receipt-discount-row');
    if (sale.desconto > 0) {
      discRow.classList.remove('hidden');
      document.getElementById('receipt-discount').innerText = `- R$ ${parseFloat(sale.desconto).toFixed(2).replace('.', ',')}`;
    } else {
      discRow.classList.add('hidden');

    if (!State.lastSale) return;
    const s = State.lastSale;
    let txt = `*${State.config.NOME_MERCADINHO || 'MERCADINHO PRO'}*\n`;
    txt += `_Cupom de Venda: ${s.idVenda}_\n`;
    txt += `Data: ${new Date(s.dataHora).toLocaleString('pt-BR')}\n\n`;
    txt += `*ITENS:*\n`;
    s.itens.forEach(it => {
      txt += `${it.quantidade}x ${it.nomeProduto} - R$ ${parseFloat(it.totalItem).toFixed(2).replace('.', ',')}\n`;
    });
    txt += `\n*TOTAL: R$ ${parseFloat(s.total).toFixed(2).replace('.', ',')}*\n`;

    if (s.troco > 0) txt += `Troco: R$ ${parseFloat(s.troco).toFixed(2).replace('.', ',')}\n`;
    txt += `\n_${State.config.MENSAGEM_RODAPE || 'Obrigado pela preferência!'}_`;

    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`;
    window.open(url, '_blank');
  }

  function renderInventoryTable() {
    const tbody = document.getElementById('inventory-tbody');
    const search = (document.getElementById('inventory-search').value || '').toLowerCase();
    const cat = document.getElementById('inventory-category-filter').value;

    const filtered = State.products.filter(p => {
      const matchSearch = p.nome.toLowerCase().includes(search) || 
                          (p.codigoBarras && p.codigoBarras.includes(search)) || 
                          p.categoria.toLowerCase().includes(search);
      const matchCat = !cat || p.categoria === cat;
      return matchSearch && matchCat && (p.ativo !== false);
    });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-500">Nenhum produto cadastrado com esses filtros.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(p => {
      const custo = parseFloat(p.precoCusto) || 0;
      const venda = parseFloat(p.precoVenda) || 0;
      const margem = custo > 0 ? (((venda - custo) / custo) * 100).toFixed(0) : '100';
      const estoque = parseFloat(p.estoqueAtual) || 0;
      const min = parseFloat(p.estoqueMinimo) || 0;

      let badgeEstoque = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${estoque} ${p.unidade}</span>`;
      if (estoque <= 0) {
        badgeEstoque = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">Esgotado (0)</span>`;
      } else if (estoque <= min) {
        badgeEstoque = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">Baixo (${estoque})</span>`;
      }

      return `
        <tr class="hover:bg-slate-900/60 transition">
          <td class="py-3 px-4 font-mono text-slate-400">${p.codigoBarras || '-'}</td>
          <td class="py-3 px-4 font-bold text-white">${p.nome}</td>
          <td class="py-3 px-4 text-slate-400">${p.categoria}</td>
          <td class="py-3 px-4 text-right font-mono text-slate-400">R$ ${custo.toFixed(2).replace('.', ',')}</td>
          <td class="py-3 px-4 text-right font-mono font-bold text-emerald-400">R$ ${venda.toFixed(2).replace('.', ',')}</td>
          <td class="py-3 px-4 text-center font-mono text-indigo-300 font-semibold">${margem}%</td>
          <td class="py-3 px-4 text-center">${badgeEstoque}</td>
          <td class="py-3 px-4 text-center">
            <div class="inline-flex items-center gap-1.5">
              <button onclick="openProductModal('${p.id}')" class="p-1.5 text-slate-400 hover:text-indigo-400 transition rounded hover:bg-slate-800" title="Editar">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
              <button onclick="quickStockPrompt('${p.id}')" class="p-1.5 text-slate-400 hover:text-emerald-400 transition rounded hover:bg-slate-800" title="Ajustar Saldo">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
              </button>
              <button onclick="handleDeleteProduct('${p.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition rounded hover:bg-slate-800" title="Excluir">
                <i data-lucide="trash" class="w-4 h-4"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    lucide.createIcons();
  }

  function calculateMarginPreview() {
    const cost = parseFloat(document.getElementById('prod-form-cost').value) || 0;
    const price = parseFloat(document.getElementById('prod-form-price').value) || 0;
    const display = document.getElementById('prod-form-margin-preview');
    if (cost > 0 && price > 0) {
      const margin = (((price - cost) / cost) * 100).toFixed(1);
      display.innerText = `${margin}%`;
    } else {
      display.innerText = '0%';
    }
  }

  function handleSaveProduct(e) {
    e.preventDefault();
    const productData = {
      id: document.getElementById('prod-form-id').value || null,
      codigoBarras: document.getElementById('prod-form-barcode').value.trim(),
      nome: document.getElementById('prod-form-name').value.trim(),
      categoria: document.getElementById('prod-form-category').value,
      precoCusto: parseFloat(document.getElementById('prod-form-cost').value) || 0,
      precoVenda: parseFloat(document.getElementById('prod-form-price').value) || 0,
      estoqueAtual: parseFloat(document.getElementById('prod-form-stock').value) || 0,
      estoqueMinimo: parseFloat(document.getElementById('prod-form-min-stock').value) || 0,
      unidade: document.getElementById('prod-form-unit').value
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res.success && res.data) {
            const idx = State.products.findIndex(p => p.id === res.data.id);
            if (idx > -1) State.products[idx] = res.data;
            else State.products.unshift(res.data);

            renderInventoryTable();
            closeProductModal();
            showToast('Produto salvo com sucesso no Google Sheets!', 'success');
          } else {
            showToast(res.error || 'Erro ao salvar produto', 'error');
          }
        })
        .apiSaveProduct(productData);
    } else {
      // Mock local
      if (!productData.id) productData.id = 'PRD-' + Date.now();
      const idx = State.products.findIndex(p => p.id === productData.id);
      if (idx > -1) State.products[idx] = productData;
      else State.products.unshift(productData);

      renderInventoryTable();
      closeProductModal();
      showToast('Produto salvo com sucesso!', 'success');
    }
  }

  function quickStockPrompt(id) {
    const prod = State.products.find(p => p.id === id);
    if (!prod) return;
    const qtdStr = prompt(`Ajustar estoque para "${prod.nome}". Digite a quantidade a adicionar (ex: 10 ou -5 para diminuir):`, "10");
    if (!qtdStr) return;
    const delta = parseFloat(qtdStr);
    if (isNaN(delta) || delta === 0) return;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            prod.estoqueAtual = res.data.saldoNovo;
            renderInventoryTable();
            showToast(`Estoque de "${prod.nome}" atualizado para ${res.data.saldoNovo}.`, 'success');
          }
        })
        .apiAdjustStock(id, delta, 'AJUSTE_RAPIDO', 'Ajuste manual via tabela');
    } else {
      prod.estoqueAtual = Math.max(0, (parseFloat(prod.estoqueAtual) || 0) + delta);
      renderInventoryTable();
      showToast(`Estoque atualizado para ${prod.estoqueAtual}.`, 'success');
    }
  }

  function handleDeleteProduct(id) {
    const prod = State.products.find(p => p.id === id);
    if (!prod) return;
    if (confirm(`Deseja realmente inativar o produto "${prod.nome}"?`)) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(res => {
            if (res.success) {
              State.products = State.products.filter(p => p.id !== id);
              renderInventoryTable();
              showToast('Produto inativado.', 'info');
            }
          })
          .apiDeleteProduct(id);
      } else {
        State.products = State.products.filter(p => p.id !== id);
        renderInventoryTable();
        showToast('Produto inativado.', 'info');
      }
    }
  }

  // =========================================================================

  // =========================================================================

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const colors = {
      success: 'bg-emerald-950/90 border-emerald-500/40 text-emerald-300',
      error: 'bg-rose-950/90 border-rose-500/40 text-rose-300',
      warning: 'bg-amber-950/90 border-amber-500/40 text-amber-300',
      info: 'bg-slate-900/90 border-indigo-500/40 text-indigo-300'
    };

    toast.className = `px-4 py-3 rounded-xl border backdrop-blur-md shadow-2xl text-xs font-semibold flex items-center gap-2 animate-slide-up pointer-events-auto transition ${colors[type] || colors.info}`;
    toast.innerHTML = `<span>${message}</span>`;

    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(10px)';
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }
</script>
